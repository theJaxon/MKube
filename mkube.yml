---
- hosts: worker,controlplane
  tasks:
  - name: Add machine entries in /etc/hosts 
    ansible.builtin.blockinfile:
      block: |
        192.168.100.10 controlplane controlplane.mkube 
        192.168.100.11 worker worker.mkube 
      path: /etc/hosts

  # CRI-O 1.34+ honours short-name-mode = "enforcing" from Fedora's registries.conf.
  # With several unqualified-search-registries, short names like "busybox" or
  # "traefik/whoami" are ambiguous and fail with ImageInspectError.
  # Resolving them only against docker.io makes them unambiguous again.
  - name: Resolve unqualified image names against docker.io only
    ansible.builtin.copy:
      dest: /etc/containers/registries.conf.d/99-mkube-unqualified-search.conf
      content: |
        unqualified-search-registries = ["docker.io"]
      mode: "0644"
    register: crio_registries

  - name: Restart CRI-O to pick up the registries change
    ansible.builtin.systemd:
      name: crio
      state: restarted
    when: crio_registries.changed

- hosts: worker
  tasks:
  # The box's .bashrc exports KUBECONFIG=~/.kube/conf, which doesn't exist on the worker.
  # Point it at the kubeconfig the controlplane shares via /vagrant.
  - name: Point KUBECONFIG on the worker at the shared kubeconfig
    ansible.builtin.lineinfile:
      path: /home/vagrant/.bashrc
      regexp: '^export KUBECONFIG='
      line: export KUBECONFIG=/vagrant/kubeconf

- hosts: controlplane
  roles:
    - controlplane

- hosts: controlplane
  vars:
    ansible_ssh_user: vagrant
    ansible_ssh_private_key_file: "/vagrant/vagrant.key.rsa"
  tasks:
    - name: Copy kubeconfig file for later use by Headlamp
      copy: 
        src: /home/vagrant/.kube/conf
        dest: /vagrant/kubeconf

    - name: Change private key permissions
      file:
        path: "/vagrant/vagrant.key.rsa"
        mode: 0600

    - name: Run Join script 
      script: /home/vagrant/join.sh
      delegate_to: worker

- hosts: controlplane
  roles:
    - extras
