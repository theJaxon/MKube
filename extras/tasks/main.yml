---
- name: Install addons
  command: kubectl apply -f /vagrant/extras/files/{{ item }}.yaml
  loop:
  - local-path-storage-0.0.34
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

  # Replaces the retired ingress-nginx controller
  # https://kubernetes.io/blog/2025/11/11/ingress-nginx-retirement/
- name: Add Traefik helm repository
  kubernetes.core.helm_repository:
    name: traefik
    repo_url: "https://traefik.github.io/charts"

- name: Deploy Traefik ingress controller chart
  kubernetes.core.helm:
    name: traefik
    chart_ref: traefik/traefik
    # Pinned so a new chart major can't change the values schema under us (Traefik v3.7.18)
    chart_version: 42.4.0
    release_namespace: traefik
    create_namespace: true
    values:
      ingressClass:
        enabled: true
        isDefaultClass: true
      # The Traefik chart sets the Service type under service.spec; its values schema
      # rejects the old service.type key, so the release fails to install.
      service:
        spec:
          type: NodePort
      ports:
        web:
          nodePort: 30000
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

- name: Set local path provisioner as default storage class
  lineinfile:
    path: /etc/kubernetes/manifests/kube-apiserver.yaml
    regexp: '- --enable-admission-plugins=NodeRestriction'
    line: '    - --enable-admission-plugins=NodeRestriction,DefaultStorageClass'
    state: present

  # https://kubernetes.io/docs/reference/using-api/health-checks/#api-endpoints-for-health
- name: Wait for API Server to be ready after changes were made
  uri:
    url: https://localhost:6443/livez?verbose
    validate_certs: false
  register: result
  retries: 12
  delay: 10
  until: result.status == 200

- name: Patch Storage Class for local path provisioner
  command: | 
    kubectl patch sc local-path -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
